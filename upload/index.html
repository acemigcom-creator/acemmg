<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>  <style>
    body {
      margin: 0;
      background: #000;
    }video {
  width: 100%;
  height: 100vh;
  object-fit: contain;
  background: #000;
}

#title {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #fff;
  font-size: 14px;
}

</style></head><body>  <p id="title"></p><video id="player" controls playsinline controlsList="nodownload"></video>

  <script>
    const JSON_URL = "../videos.json";
    const DIRECT_LINK = "https://auctionr.org/4/ee48871020da027a4379c1a5ecf9f906";

    const video = document.getElementById("player");
    const title = document.getElementById("title");

    let redirected = false;

    const params = new URLSearchParams(window.location.search);
    const id = params.get("f");

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        const vids = data.videos;

        const selected = vids.find(v => v.id === id);

        if (!selected) {
          title.innerText = "Video tidak ditemukan";
          return;
        }

        video.src = selected.cdn;
        title.innerText = selected.id;
      })
      .catch(() => {
        title.innerText = "Gagal memuat video";
      });

    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.href = DIRECT_LINK;
      }
    });
  </script></body></html>
